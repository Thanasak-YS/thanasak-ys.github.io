<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เว็บทดสอบของฉัน</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #6366f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: white;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 220px;
      padding: 16px;
      margin: 10px;
      background-color: white;
      color: #4f46e5;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
    }

    .button:hover {
      background-color: #eef2ff;
    }
  </style>
</head>
<body>

  <h1>เว็บทดสอบของฉัน</h1>

  <!-- ปุ่มแต่ละอันคือ tag <a> ที่มี href เป็นลิงก์ปลายทาง -->
  <a class="button" href="https://www.youtube.com">ไปที่ YouTube</a>
  <a class="button" href="https://www.google.com">ไปที่ Google</a>
  <a class="button" href="https://www.instagram.com">ไปที่ Instagram</a>

</body>
</html>
