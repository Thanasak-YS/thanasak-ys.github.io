<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Daisyy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #ffed9bf1;
      margin: 0;
      min-height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #ffe677f1;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ปุ่มโลโก้ */
    .logo-button {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);

      width: 100px;
      height: 100px;

      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 102;
    }

    /* โลโก้ */
    header .logo {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* ===== จุดที่แก้ 1: โลโก้หมุนตลอด ===== */
    .logo.rotate {
      animation: spin 1s linear infinite;
    }

    /* ===== จุดที่แก้ 2: สร้าง Animation การหมุน ===== */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      color: #f33c3c;
    }

    header h1::after {
      content: '';
      display: block;
      width: 100%;
      height: 3px;
      background-color: #ff0505;
      margin-top: 4px;
    }

    /* เมนู */
    .logo-menu {
      position: fixed;
      top: 70px;
      left: 15px;

      width: 220px;
      padding: 20px;

      background: #ffe677;
      border-radius: 0 0 15px 15px;

      box-shadow: 0 5px 15px rgba(0,0,0,0.2);

      /* ซ่อนไว้ก่อน */
      opacity: 0;
      transform: translateX(-250px);
      pointer-events: none;

      transition: 0.4s ease;

      z-index: 101;
    }

    /* ตอนเปิดเมนู */
    .logo-menu.show {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .logo-menu a {
      display: block;
      padding: 12px;
      margin: 5px 0;

      text-decoration: none;
      color: #f33c3c;
      font-weight: bold;

      border-radius: 10px;
      transition: 0.2s;
    }

    .logo-menu a:hover {
      background-color: #fff952;
    }

    main {
      display: flex;
      place-items: center;
      padding-top: 90px;
      min-height: calc(100vh - 90px);
    }

    .button {
      display: block;
      width: 220px;
      padding: 16px;
      margin: 10px;
      background-color: #fffb00f1;
      color: #000;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
    }

    .button:hover {
      background-color: #fff952f1;
    }
  </style>
</head>

<body>

  <header>

    <!-- โลโก้ที่กดได้ -->
    <button class="logo-button" onclick="toggleMenu()">
      <img src="images/Logo.png" alt="Logo" class="logo" id="logo">
    </button>

    <h1>Daisyy</h1>

  </header>

  <div class="logo-menu" id="logoMenu">
    <a href="https://www.youtube.com" target="_blank">🏠 Youtube</a>
    <a href="https://www.instagram.com" target="_blank">🌼 IG</a>
    <a href="FAKE.html" target="_blank">📷 แกลเลอรี</a>
    <a href="https://expo.dev/accounts/thanasak-ys/projects/randomnapp/builds/a99524f6-599b-4e5c-9caf-8e4814e214d3" target="_blank">⬇️ ดาวน์โหลดไฟล์</a>
  </div>

  <main>
    <a class="button" href="https://www.youtube.com" target="_blank">ไปที่ YouTube</a>
    <a class="button" href="https://www.google.com" target="_blank">ไปที่ Google</a>
    <a class="button" href="https://www.instagram.com" target="_blank">ไปที่ Instagram</a>
  </main>

  <script>

    /* ===== จุดที่แก้ 3: JavaScript ===== */
    function toggleMenu() {
      const menu = document.getElementById("logoMenu");
      const logo = document.getElementById("logo");

      // เปิด/ปิดเมนู
      menu.classList.toggle("show");

      // เปิด/ปิดการหมุน
      logo.classList.toggle("rotate");
    }

  </script>

</body>
</html>
